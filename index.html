<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فهرس قناة البحث العلمي</title>
<meta name="description" content="فهرس موضوعي لقناة «البحث العلمي»: مهارات كتابة البحث، المخطوطات والتحقيق، الكشافات والقرارات، المكتبات والمحركات، والأدوات التقنية للباحث.">
<meta name="theme-color" content="#1d2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="البحث العلمي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#1f2433;--muted:#77737a;--navy:#1d2a44;--gold:#b08a3e;--soft:#f1e6cc;--line:#ebe2cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri",serif;font-size:18px;line-height:1.65}
a{color:inherit;text-decoration:none}
header{background:var(--navy);color:#fff;padding:26px 16px 22px}
.in{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:27px;cursor:pointer}
header p{margin:2px 0 14px;color:#cbbf9f;font-size:15px}
#q{width:100%;padding:12px 16px;font:inherit;font-size:18px;border:none;border-radius:14px;background:#fff;color:var(--ink)}
#q:focus{outline:3px solid var(--gold)}
main{max-width:760px;margin:0 auto;padding:18px 14px 50px}
h2.sec{font-size:19px;margin:26px 0 10px;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:132px;transition:.15s}
.card:active{transform:scale(.98)}
.card .ic{font-size:28px;line-height:1}
.card b{font-size:18.5px;line-height:1.45}
.card small{color:var(--muted);font-size:14px;margin-top:auto}
.list{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.list>:first-child .row,.list>.row:first-child{border-top:none}
.list>details:first-child>summary.row{border-top:none}
.row:active{background:var(--soft)}
.tt{flex:1;min-width:0}
.crumb{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.k{flex:none;font-size:12.5px;color:var(--gold);border:1px solid var(--soft);background:#fbf6ea;border-radius:8px;padding:0 7px;white-space:nowrap}
details.ser>summary{list-style:none}
details.ser>summary::-webkit-details-marker{display:none}
details.ser .parts{padding:0 14px 8px;background:#fcf9f2}
details.ser .parts a{display:block;padding:5px 12px;border-inline-start:2px solid var(--soft);font-size:16.5px}
.back{display:inline-block;color:var(--navy);font-size:16px;margin-bottom:6px}
.chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.chead .ic{font-size:30px;line-height:1.2}
.chead h1{font-size:23px;margin:0;line-height:1.45}
.chips{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:10px 14px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 13px;font-size:15px;white-space:nowrap}
.chips a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grp{font-size:15px;color:var(--gold);margin:24px 2px -4px;font-weight:700}
h3.st{font-size:18px;margin:20px 2px 8px;color:var(--navy);scroll-margin-top:60px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
footer{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 0 0}
footer a{text-decoration:underline}
mark{background:#f5dd9e;color:inherit;border-radius:3px}
.homebtn{display:none;color:var(--soft);font-size:15px;border:1px solid rgba(241,230,204,.4);border-radius:999px;padding:2px 12px;margin-bottom:10px}
body.inner .homebtn{display:inline-block}
.chips a.hm{background:var(--gold);color:#fff;border-color:var(--gold)}
</style>
</head>
<body>
<header><div class="in">
  <a id="homeBtn" class="homebtn" href="#">⌂ القائمة الرئيسية</a>
  <h1 id="home">فهرس قناة «البحث العلمي»</h1>
  <p>دليل الباحث إلى كل ما نُشر في القناة</p>
  <input id="q" type="search" placeholder="ابحث في الفهرس…" autocomplete="off">
</div></header>
<main id="app"></main>
<script>
const ICONS=["✍️","📜","📚","🔎","💻","🧩"];
const SHORT=["كتابة البحث العلمي","المخطوطات والتحقيق","الموسوعات والكشافات والقرارات","المكتبات والمجلات والمحركات","أدوات تقنية للباحث","منوّع"];
const KIND={P:"PDF",F:"ملف",L:"موقع",V:"مقطع",T:"فائدة",A:"تطبيق"};
const S={d:null,q:"",chs:[],loc:{}};
const norm=s=>s.replace(/[ً-ْٰـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=t=>t.replace(/^[أ-ي]-\s*/,"");
let byId={};const tg=id=>"https://t.me/"+S.d.channel+"/"+id;

function build(){
  const d=S.d,used=new Set(),mark=p=>{used.add(p.id);if(p.s&&d.series[p.s])d.series[p.s].parts.forEach(i=>used.add(i))};
  d.chapters.forEach(c=>c.sections.forEach(s=>(s.items||[]).forEach(([id])=>{const p=id!=null&&byId[id];if(p)mark(p)})));
  const item=(p,label)=>{const ser=p.s&&d.series[p.s];return{p:ser?byId[ser.parts[0]]||p:p,label:ser&&!label?ser.title:(label||p.title),ser}};
  let chs=d.chapters.map(c=>({title:c.title,auto:c.auto,sections:c.sections.map(s=>{
    let items=[];
    if(s.items)s.items.forEach(([id,label])=>{const p=id!=null&&byId[id];if(p)items.push(item(p,label))});
    else{const src=s.cat==="*"?[...d.posts].sort((a,b)=>b.id-a.id):d.posts;
      src.forEach(p=>{if(used.has(p.id)||(s.cat!=="*"&&p.cat!==s.cat)||(s.new&&!p.auto))return;mark(p);items.push(item(p))})}
    return{t:strip(s.t),group:(s.group||[]).map(strip),items};
  }).filter(s=>s.items.length)})).filter(c=>c.sections.length);
  const extra=chs.filter(c=>c.auto),real=chs.filter(c=>!c.auto);
  extra.forEach(c=>c.sections.forEach(s=>{if(s.t==="مواد أخرى")s.t="منشورات أخرى";real[real.length-1].sections.push(s)}));
  S.chs=real;
  real.forEach((c,ci)=>c.sections.forEach(s=>s.items.forEach(it=>{if(!S.loc[it.p.id])S.loc[it.p.id]={ci,st:s.t}})));
}
function hl(t){let o=esc(t);if(!S.q)return o;S.q.split(/\s+/).filter(w=>w.length>1).forEach(w=>{o=o.split(esc(w)).join("<mark>"+esc(w)+"</mark>")});return o}
function rowHtml(it,crumb){
  const {p,label,ser}=it;
  const tt=`<span class="tt">${hl(label)}${crumb?`<span class="crumb">${esc(crumb)}</span>`:""}</span>`;
  if(ser&&ser.parts.length>1){
    return `<details class="ser"><summary class="row">${tt}<span class="k">${ser.parts.length} أجزاء ▾</span></summary><div class="parts">`+
      ser.parts.map(i=>byId[i]).filter(Boolean).map(x=>`<a href="${tg(x.id)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join("")+`</div></details>`;
  }
  return `<a class="row" href="${tg(p.id)}" target="_blank" rel="noopener">${tt}<span class="k">${KIND[p.kind]||""}</span></a>`;
}
function crumbOf(id){const l=S.loc[id];return l?(SHORT[l.ci]||S.chs[l.ci].title)+" › "+l.st:""}
function home(){
  const latest=[...S.d.posts].sort((a,b)=>b.id-a.id),seen=new Set(),rows=[];
  for(const p of latest){const key=p.s||p.id;if(seen.has(key))continue;seen.add(key);
    rows.push({p,label:p.s&&S.d.series[p.s]?S.d.series[p.s].title:p.title,ser:null});if(rows.length===6)break}
  return `<div class="grid">`+S.chs.map((c,i)=>{const n=c.sections.reduce((a,s)=>a+s.items.length,0);
      return `<a class="card" href="#c=${i}"><span class="ic">${ICONS[i]||"📁"}</span><b>${esc(SHORT[i]||c.title)}</b><small>${c.sections.length} أقسام · ${n} مادة</small></a>`}).join("")+`</div>`+
    `<h2 class="sec">أحدث ما نُشر في القناة</h2><div class="list">`+rows.map(it=>rowHtml(it,crumbOf(it.p.id))).join("")+`</div>`+
    `<footer>${S.d.posts.length} منشورًا مفهرسًا · يُحدَّث تلقائيًا من <a href="https://t.me/${S.d.channel}" target="_blank" rel="noopener">القناة</a></footer>`;
}
function chapter(ci){
  const c=S.chs[ci];if(!c)return home();
  let last="",body="";
  c.sections.forEach((s,j)=>{const g=s.group.join(" › ");if(g&&g!==last)body+=`<div class="grp">${esc(g)}</div>`;last=g;
    body+=`<h3 class="st" id="s${j}">${esc(s.t)}</h3><div class="list">`+s.items.map(it=>rowHtml(it)).join("")+`</div>`});
  return `<a class="back" href="#">→ القائمة الرئيسية</a><div class="chead"><span class="ic">${ICONS[ci]||"📁"}</span><h1>${esc(c.title)}</h1></div>`+
    (c.sections.length>1?`<nav class="chips"><a class="hm" href="#">⌂ الرئيسية</a>`+c.sections.map((s,j)=>`<a href="#c=${ci}&s=${j}" data-s="${j}">${esc(s.t)}</a>`).join("")+`</nav>`:"")+body;
}
function search(){
  const words=norm(S.q).split(/\s+/).filter(Boolean),seen=new Set(),res=[];
  S.chs.forEach(c=>c.sections.forEach(s=>s.items.forEach(it=>{
    const txt=norm(it.label+" "+it.p.title+" "+(it.ser?it.ser.parts.map(i=>byId[i]?byId[i].title:"").join(" "):""));
    if(!seen.has(it.p.id)&&words.every(w=>txt.includes(w))){seen.add(it.p.id);res.push(it)}})));
  return `<h2 class="sec" style="margin-top:4px">${res.length?res.length+" نتيجة":"لا نتائج"}</h2>`+
    (res.length?`<div class="list">`+res.map(it=>rowHtml(it,crumbOf(it.p.id))).join("")+`</div>`:`<div class="empty">جرّب كلمة أخرى، مثل: كشاف، مخطوط، الشاملة، مجلة</div>`);
}
function render(scrollTop=true){
  const app=document.getElementById("app"),m=location.hash.match(/c=(\d+)(?:&s=(\d+))?/);
  document.body.classList.toggle("inner",!!(S.q||m));
  if(S.q){app.innerHTML=search();return}
  app.innerHTML=m?chapter(+m[1]):home();
  if(m&&m[2]!=null){const el=document.getElementById("s"+m[2]);if(el){el.scrollIntoView();
      document.querySelectorAll(".chips a").forEach(a=>a.classList.toggle("on",a.dataset.s===m[2]));return}}
  if(scrollTop)window.scrollTo(0,0);
}
document.getElementById("homeBtn").onclick=e=>{e.preventDefault();S.q="";document.getElementById("q").value="";history.pushState(null,"",location.pathname);render()};
document.getElementById("home").onclick=()=>{S.q="";document.getElementById("q").value="";location.hash="";render()};
let t;document.getElementById("q").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{S.q=e.target.value.trim();render(false)},150)});
window.addEventListener("hashchange",()=>{if(S.q){S.q="";document.getElementById("q").value=""}render()});
fetch("data/posts.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  d.series=d.series||{};S.d=d;d.posts.forEach(p=>byId[p.id]=p);build();render();
}).catch(()=>{document.getElementById("app").innerHTML='<div class="empty">تعذّر تحميل الفهرس.</div>'});
</script>
</body>
</html>
