<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فهرس قناة البحث العلمي</title>
<meta name="description" content="فهرس مصنّف لكل ما نُشر في قناة «البحث العلمي»: كشافات وأدلة وفهارس مخطوطات ومواقع وأدوات للباحثين، مع مسارات للباحث.">
<meta name="theme-color" content="#1d2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="البحث العلمي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--paper:#fffdf8;--ink:#1f2433;--muted:#6b6a72;--navy:#1d2a44;--gold:#b08a3e;--gold-soft:#f1e6cc;--line:#e6dcc6;--blue:#e8ebf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri",serif;font-size:18px;line-height:1.7}
a{color:inherit}
header{background:var(--navy);color:#fff;padding:24px 18px 0;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:#d9cfb8;font-size:15px}
header p a{color:var(--gold-soft)}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:14px}
.tabs button{font:inherit;font-size:17px;background:none;border:none;color:#cfd6e4;padding:8px 16px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 6px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:11px 14px;font:inherit;font-size:18px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
#q:focus{outline:2px solid var(--gold);border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 13px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on b{color:var(--gold-soft)}
.chip.sub{font-size:14px;background:var(--gold-soft);border-color:transparent}
.chip.sub.on{background:var(--gold);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;padding:4px 0}
.meta button{font:inherit;font-size:15px;background:none;border:none;color:var(--navy);cursor:pointer;text-decoration:underline}
ul{list-style:none;margin:0;padding:0 0 30px}
li.it{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:9px 0;padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
.num{flex:none;min-width:44px;text-align:center;color:var(--gold);font-weight:700;font-size:15px;padding-top:2px;line-height:1.3}
.body{flex:1;min-width:0}
.t{font-size:18.5px;font-weight:700;text-decoration:none;display:block}
.t:hover{color:var(--gold)}
.tags{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;font-size:13.5px}
.tag{background:var(--gold-soft);color:#6d5320;border-radius:6px;padding:0 7px}
.tag.k{background:var(--blue);color:var(--navy)}
.tag.new{background:var(--navy);color:#fff}
.tag.ser{background:#fff;border:1px solid var(--gold);color:#6d5320}
.also{font-size:14px;color:var(--muted);margin-top:2px}
.also a{color:var(--navy)}
.acts{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.go{background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:5px 12px;font-size:15px;border:none;font-family:inherit;cursor:pointer}
.ic{background:none;border:none;cursor:pointer;font-size:19px;line-height:1;padding:2px;color:var(--gold)}
details.parts{margin-top:6px}
details.parts summary{cursor:pointer;color:var(--navy);font-size:15px}
details.parts ol{margin:6px 0 0;padding-inline-start:22px;font-size:16px}
details.parts li{margin:2px 0}
details.parts a{text-decoration:none;color:var(--ink)}
details.parts a:hover{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:14px;padding:6px 0 30px}
mark{background:#f5dd9e;color:inherit;border-radius:3px}
#paths{display:none;padding:14px 0 40px}
body.p-paths #paths{display:block}
body.p-paths .bar,body.p-paths #list,body.p-paths #view{display:none}
.path{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.path>summary{list-style:none;cursor:pointer;padding:14px 16px}
.path>summary::-webkit-details-marker{display:none}
.path h3{margin:0;font-size:21px}
.path .d{color:var(--muted);font-size:15px}
.path .n{color:var(--gold);font-size:14px}
.steps{padding:0 16px 14px;margin:0;list-style:none;counter-reset:s}
.steps>li{counter-increment:s;position:relative;padding:8px 40px 8px 0;border-top:1px dashed var(--line)}
.steps>li:before{content:counter(s);position:absolute;right:0;top:9px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.steps h4{margin:0 0 2px;font-size:18px}
.steps ul{padding:0;margin:0}
.steps ul li{font-size:16px;margin:1px 0}
.steps ul a{text-decoration:none}
.steps ul a:hover{color:var(--gold)}
.steps ul a:before{content:"◂ ";color:var(--gold)}
#view{display:none;padding:14px 0 40px}
body.p-view #view{display:block}
body.p-view .bar,body.p-view #list,body.p-view #paths{display:none}
.back{font:inherit;font-size:16px;background:none;border:none;color:var(--navy);cursor:pointer;padding:0;margin-bottom:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:4px 0 10px;font-size:23px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-size:16px;border-radius:10px;padding:7px 16px;border:1px solid var(--navy);background:var(--navy);color:#fff;text-decoration:none;cursor:pointer}
.btn.o{background:none;color:var(--navy)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>فهرس قناة «البحث العلمي»</h1>
  <p>كل ما نُشر في <a href="https://t.me/al_bahth_al_ilmi" target="_blank" rel="noopener">القناة</a> مصنّفًا بعناوين — يُحدَّث تلقائيًا</p>
  <div class="tabs"><button type="button" data-p="paths" class="on">الفهرس الموضوعي</button><button type="button" data-p="list">بحث وتصفية</button><button type="button" data-p="fav">المفضلة</button></div>
</header>
<div class="wrap">
  <div class="bar">
    <input id="q" type="search" placeholder="ابحث: مخطوطات، كشاف، الشاملة، مجلة…" autocomplete="off">
    <div class="chips" id="cats"></div>
    <div class="chips" id="subs"></div>
    <div class="chips" id="kinds"></div>
    <div class="meta"><span id="count"></span><button id="sort" type="button"></button></div>
  </div>
  <ul id="list"></ul>
  <section id="paths"></section>
  <section id="view"></section>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const S={d:null,cat:"",sub:"",kind:"",q:"",newest:true,page:"paths",fav:new Set()};
try{S.fav=new Set(JSON.parse(localStorage.getItem("fav")||"[]"))}catch(e){}
const saveFav=()=>{try{localStorage.setItem("fav",JSON.stringify([...S.fav]))}catch(e){}};
const norm=s=>s.replace(/[ً-ْٰـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tg=id=>"https://t.me/"+S.d.channel+"/"+id;
const siteUrl=id=>location.origin+location.pathname+"#p="+id;
const byId=id=>S.byId[id];
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function hl(t){
  let out=esc(t);if(!S.q)return out;
  S.q.split(/\s+/).filter(w=>w.length>1).forEach(w=>{out=out.split(esc(w)).join("<mark>"+esc(w)+"</mark>")});return out;
}
function chip(box,key,val,label,n,cls){
  const b=document.createElement("button");b.type="button";b.className="chip"+(cls?" "+cls:"")+(S[key]===val?" on":"");
  b.innerHTML="<bdi>"+esc(label)+"</bdi>"+(n!=null?" <b>"+n+"</b>":"");
  b.onclick=()=>{S[key]=(S[key]===val&&val!=="")?"":val;if(key==="cat")S.sub="";render()};box.appendChild(b);
}
const inCat=(p,c)=>!c||p.cat===c||(p.tags||[]).includes(c);
function tagsHtml(p,extra){
  const d=S.d,sub=p.sub&&d.subs[p.cat]?d.subs[p.cat][p.sub]:"";
  return `<div class="tags"><span class="tag">${esc(d.cats[p.cat])}</span>`+(sub?`<span class="tag">${esc(sub)}</span>`:"")+
    (p.tags||[]).map(t=>`<span class="tag">${esc(d.cats[t])}</span>`).join("")+
    (extra||`<span class="tag k">${esc(d.kinds[p.kind]||"")}</span>`)+(p.auto?'<span class="tag new">جديد</span>':"")+`</div>`;
}
function alsoHtml(p){return p.also?`<div class="also">نُشر أيضًا: ${p.also.map(i=>`<a href="${tg(i)}" target="_blank" rel="noopener">#${i}</a>`).join("، ")}</div>`:""}
function actsHtml(id,href){
  return `<div class="acts"><a class="go" href="${href}" target="_blank" rel="noopener">فتح</a>`+
    `<button class="ic fav" type="button" data-id="${id}" aria-label="المفضلة">${S.fav.has(id)?"★":"☆"}</button>`+
    `<button class="ic share" type="button" data-id="${id}" aria-label="مشاركة">⤴</button></div>`;
}
function itemHtml(p){
  return `<li class="it"><span class="num">#${p.id}</span><div class="body"><a class="t" href="${tg(p.id)}" target="_blank" rel="noopener">${hl(p.title)}</a>`+
    tagsHtml(p)+alsoHtml(p)+`</div>`+actsHtml(p.id,tg(p.id))+`</li>`;
}
function seriesHtml(key,parts){
  const d=S.d,s=d.series[key],all=s.parts.map(byId).filter(Boolean),first=all[0]||parts[0];
  const shown=parts.length<all.length?parts:all;
  return `<li class="it"><span class="num">${all.length}<br><small style="font-weight:400;color:var(--muted)">أجزاء</small></span><div class="body">`+
    `<a class="t" href="${tg(first.id)}" target="_blank" rel="noopener">${hl(s.title)}</a>`+
    tagsHtml(first,`<span class="tag ser">سلسلة</span>`)+
    `<details class="parts"${S.q?" open":""}><summary>عرض الأجزاء (${shown.length}${shown.length<all.length?" من "+all.length:""})</summary><ol>`+
    shown.map(p=>`<li><a href="${tg(p.id)}" target="_blank" rel="noopener">${hl(p.title)}</a> <small style="color:var(--gold)">#${p.id}</small></li>`).join("")+
    `</ol></details></div>`+actsHtml(first.id,tg(first.id))+`</li>`;
}
function render(){
  const d=S.d;
  document.body.className=S.page==="paths"?"p-paths":(S.page==="view"?"p-view":"");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.p===S.page||(S.page==="view"&&b.dataset.p==="list")));
  if(S.page==="paths"){renderPaths();return}
  if(S.page==="view")return;
  const words=norm(S.q).split(/\s+/).filter(Boolean);
  let base=d.posts.filter(p=>words.every(w=>p._n.includes(w)));
  if(S.page==="fav")base=base.filter(p=>S.fav.has(p.id));
  const cats=document.getElementById("cats"),subs=document.getElementById("subs"),kinds=document.getElementById("kinds");
  cats.innerHTML=subs.innerHTML=kinds.innerHTML="";
  const k1=base.filter(p=>!S.kind||p.kind===S.kind);
  chip(cats,"cat","","الكل",k1.length);
  Object.entries(d.cats).forEach(([k,v])=>{const n=k1.filter(p=>inCat(p,k)).length;if(n)chip(cats,"cat",k,v,n)});
  if(S.cat&&d.subs[S.cat]){
    const c1=k1.filter(p=>p.cat===S.cat);
    Object.entries(d.subs[S.cat]).forEach(([k,v])=>{const n=c1.filter(p=>p.sub===k).length;if(n)chip(subs,"sub",k,v,n,"sub")});
  }
  const c2=base.filter(p=>inCat(p,S.cat)&&(!S.sub||p.sub===S.sub));
  chip(kinds,"kind","","كل الأنواع",null);
  Object.entries(d.kinds).forEach(([k,v])=>{const n=c2.filter(p=>p.kind===k).length;if(n)chip(kinds,"kind",k,v,n)});
  const rows=c2.filter(p=>!S.kind||p.kind===S.kind);
  const groups=new Map(),out=[];
  rows.forEach(p=>{if(p.s&&d.series[p.s]){if(!groups.has(p.s)){groups.set(p.s,[]);out.push({s:p.s})}groups.get(p.s).push(p)}else out.push(p)});
  const key=o=>o.s?(S.newest?Math.max(...groups.get(o.s).map(p=>p.id)):Math.min(...groups.get(o.s).map(p=>p.id))):o.id;
  out.sort((a,b)=>S.newest?key(b)-key(a):key(a)-key(b));
  document.getElementById("count").textContent=out.length+" مادة"+(rows.length!==out.length?" ("+rows.length+" منشورًا)":"");
  document.getElementById("sort").textContent=S.newest?"الأقدم أولًا":"الأحدث أولًا";
  const ul=document.getElementById("list");
  if(!out.length){ul.innerHTML=`<div class="empty">${S.page==="fav"&&!S.fav.size?"لم تضف شيئًا إلى المفضلة بعد. اضغط ☆ بجانب أي مادة.":"لا نتائج. جرّب كلمة أخرى."}</div>`;return}
  ul.innerHTML=out.map(o=>o.s?seriesHtml(o.s,groups.get(o.s)):itemHtml(o)).join("");
}
function chapterItems(){
  const d=S.d,used=new Set(),mark=p=>{used.add(p.id);if(p.s&&d.series[p.s])d.series[p.s].parts.forEach(i=>used.add(i))};
  d.chapters.forEach(c=>c.sections.forEach(s=>(s.items||[]).forEach(([id])=>{const p=byId(id);if(p)mark(p)})));
  return d.chapters.map(c=>({title:c.title,sections:c.sections.map(s=>{
    let items;
    if(s.items)items=s.items.filter(([id])=>byId(id)).map(([id,label])=>({p:byId(id),label}));
    else{
      const rx=s.kw?new RegExp(s.kw,"i"):null;
      items=[];
      d.posts.forEach(p=>{
        if(used.has(p.id)||p.cat!==s.cat||(s.sub&&p.sub!==s.sub))return;
        const ser=p.s&&d.series[p.s];
        if(rx&&!rx.test(p.title)&&!(ser&&rx.test(ser.title)))return;
        mark(p);items.push({p:ser?byId(ser.parts[0])||p:p,label:ser?ser.title:p.title,n:ser?ser.parts.length:0});
      });
    }
    return{t:s.t,items};
  }).filter(s=>s.items.length)}));
}
function renderPaths(){
  const d=S.d,box=document.getElementById("paths");
  if(box.dataset.done)return;
  box.innerHTML=chapterItems().map((c,i)=>{
    const n=c.sections.reduce((a,s)=>a+s.items.length,0);
    return `<details class="path"${i<2?" open":""}><summary><h3>🔴 ${esc(c.title)}</h3><div class="n">${c.sections.length} أقسام · ${n} مادة</div></summary><ol class="steps">`+
      c.sections.map(st=>`<li><h4>${esc(st.t)}</h4><ul>`+st.items.map(({p,label,n})=>
        `<li><a href="${tg(p.id)}" target="_blank" rel="noopener">${esc(label)}</a>${n?` <small style="color:var(--muted)">(${n} أجزاء)</small>`:""}${p.auto?' <span class="tag new">جديد</span>':""}</li>`).join("")+`</ul></li>`).join("")+`</ol></details>`;
  }).join("");
  box.dataset.done=1;
}
function showView(id){
  const p=byId(id),v=document.getElementById("view");if(!p){go("list");return}
  const d=S.d,s=p.s&&d.series[p.s];
  v.innerHTML=`<button class="back" type="button">→ رجوع</button><div class="card"><span class="num" style="padding:0">#${p.id}</span>`+
    `<h2>${esc(s?s.title:p.title)}</h2>`+tagsHtml(p)+alsoHtml(p)+
    (s?`<ol style="font-size:16px;padding-inline-start:22px">`+s.parts.map(byId).filter(Boolean).map(x=>`<li><a href="${tg(x.id)}" target="_blank" rel="noopener">${esc(x.title)}</a></li>`).join("")+`</ol>`:"")+
    `<div class="row"><a class="btn" href="${tg(p.id)}" target="_blank" rel="noopener">فتح في تيليجرام</a><button class="btn o share" type="button" data-id="${p.id}">مشاركة</button><button class="btn o fav" type="button" data-id="${p.id}">${S.fav.has(p.id)?"★ في المفضلة":"☆ أضف للمفضلة"}</button></div></div>`;
  v.querySelector(".back").onclick=()=>{location.hash="";};
}
function go(page){S.page=page;if(page!=="view"&&location.hash)history.replaceState(null,"",location.pathname);render();window.scrollTo(0,0)}
function route(){const m=location.hash.match(/p=(\d+)/);if(m&&S.d){if(S.page!=="view")S.prev=S.page;S.page="view";render();showView(+m[1]);window.scrollTo(0,0)}else if(S.page==="view"){S.page=S.prev||"paths";render()}}
document.addEventListener("click",async e=>{
  const f=e.target.closest(".fav"),sh=e.target.closest(".share"),tab=e.target.closest(".tabs button");
  if(tab){go(tab.dataset.p);return}
  if(f){const id=+f.dataset.id;S.fav.has(id)?S.fav.delete(id):S.fav.add(id);saveFav();toast(S.fav.has(id)?"أُضيفت إلى المفضلة":"أُزيلت من المفضلة");
    if(S.page==="view")showView(id);else render();return}
  if(sh){const id=+sh.dataset.id,p=byId(id),s=p.s&&S.d.series[p.s],title=s?s.title:p.title,url=siteUrl(id);
    try{if(navigator.share){await navigator.share({title,url});return}}catch(err){return}
    try{await navigator.clipboard.writeText(title+"\n"+url);toast("نُسخ الرابط")}catch(err){prompt("انسخ الرابط:",url)}}
});
let tmr;document.getElementById("q").addEventListener("input",e=>{clearTimeout(tmr);tmr=setTimeout(()=>{S.q=e.target.value.trim();render()},120)});
document.getElementById("sort").onclick=()=>{S.newest=!S.newest;render()};
window.addEventListener("hashchange",route);
fetch("data/posts.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  d.subs=d.subs||{};d.series=d.series||{};d.chapters=d.chapters||[];S.byId={};
  d.posts.forEach(p=>{S.byId[p.id]=p;const s=p.s&&d.series[p.s];
    p._n=norm([p.title,s?s.title:"",d.cats[p.cat]||"",p.sub&&d.subs[p.cat]?d.subs[p.cat][p.sub]:"",...(p.tags||[]).map(t=>d.cats[t]),"#"+p.id].join(" "))});
  S.d=d;
  const last=d.updated?new Date(d.updated).toLocaleDateString("ar-SA",{day:"numeric",month:"long",year:"numeric"}):"";
  document.getElementById("foot").textContent=d.posts.length+" منشورًا مفهرسًا"+(last?" · آخر تحديث "+last:"");
  render();route();
}).catch(()=>{document.getElementById("list").innerHTML='<div class="empty">تعذّر تحميل الفهرس.</div>'});
</script>
</body>
</html>
