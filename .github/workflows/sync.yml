name: مزامنة منشورات القناة

on:
  schedule:
    - cron: "*/15 * * * *"   # كل 15 دقيقة
  push:                       # يعمل أيضًا عند تعديل كود المزامنة
    branches: [main]
    paths: ["scripts/sync.mjs", ".github/workflows/sync.yml"]
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
      - name: حفظ التحديث
        run: |
          if [ -n "$(git status --porcelain data media)" ]; then
            git config user.name "bahth-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data media
            git commit -m "تحديث الفهرس من القناة"
            git pull --rebase origin main && git push
          else
            echo "لا جديد"
          fi
